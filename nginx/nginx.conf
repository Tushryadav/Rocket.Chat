# ─────────────────────────────────────────────
#  Nginx Reverse Proxy Config for Rocket.Chat
# ─────────────────────────────────────────────

worker_processes auto;

events {
  worker_connections 1024;
}

http {

  # ── Logging ──────────────────────────────────
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log;

  # ── Timeouts (important for Rocket.Chat) ─────
  proxy_read_timeout    600;
  proxy_connect_timeout 600;
  proxy_send_timeout    600;
  send_timeout          600;
  client_max_body_size  200M;   # Allow large file uploads

  # ── Upstream: points to Rocket.Chat container ─
  upstream rocketchat {
    server rocketchat:3000;   # Docker service name + internal port
  }

  # ─────────────────────────────────────────────
  #  HTTP Server (port 80)
  #  For local development — serves Rocket.Chat directly
  #  For production — redirects to HTTPS (see below)
  # ─────────────────────────────────────────────
  server {
    listen 80;
    server_name localhost;   # Change to yourdomain.com for production

    # ── For LOCAL development: proxy directly ──
    location / {
      proxy_pass         http://rocketchat;
      proxy_http_version 1.1;

      # Required headers for Rocket.Chat
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host       $host;

      proxy_set_header X-Real-IP          $remote_addr;
      proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto  $scheme;
      proxy_set_header X-Nginx-Proxy      true;

      proxy_redirect off;
    }

    # ── For PRODUCTION with SSL: redirect HTTP → HTTPS ──
    # Uncomment the block below and comment out the location block above
    # when you have a real domain and SSL certificate

    # return 301 https://$host$request_uri;
  }

  # ─────────────────────────────────────────────
  #  HTTPS Server (port 443) — FOR PRODUCTION
  #  Uncomment this entire block when you have:
  #   1. A real domain name
  #   2. SSL certificates in ./nginx/ssl/
  # ─────────────────────────────────────────────

  # server {
  #   listen 443 ssl;
  #   server_name yourdomain.com;
  #
  #   ssl_certificate     /etc/nginx/ssl/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/ssl/privkey.pem;
  #   ssl_protocols       TLSv1.2 TLSv1.3;
  #   ssl_ciphers         HIGH:!aNULL:!MD5;
