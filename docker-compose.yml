version: '3.8'

networks:
  backend:
    driver: bridge
    internal: true          # backend is NOT internet-routable — only inter-container
  frontend:
    driver: bridge          # frontend can reach the outside world (nginx needs it)

services:
  mongodb:
    image: mongo:7.0
    container_name: rocketchat_mongo
     command:  ["mongod", "--replSet", "rs0", "--bind_ip_all", "--keyFile", "/etc/mongo-keyfile"]
     restart: unless-stopped
     networks:
      - backend 
    volumes:
      - mongo_data:/data/db
      - /etc/mongo-keyfile:/etc/mongo-keyfile:ro
      
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'

  rocketchat:
    image: registry.rocket.chat/rocketchat/rocket.chat:7.4.0   # create a image using Dockerfile 
    container_name: rocketchat_app
    restart: unless-stopped
    networks:
      - backend             
      - frontend
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      - ROOT_URL=http://localhost:3000
      - PORT=3000
      - MONGO_URL=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/rocketchat?replicaSet=rs0&authSource=admin
      - MONGO_OPLOG_URL=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/local?replicaSet=rs0
      - DEPLOY_METHOD=docker
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - rocketchat_uploads:/app/uploads
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2.0'

  nginx:
    image: nginx:alpine
    container_name: rocketchat_nginx
    restart: unless-stopped
    networks:
      - frontend
    ports:
      - "8080:8080"       # HTTP
      - "8443:8443"     # HTTPS (for when you add SSL later)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro        # Nginx config 
    depends_on:
      - rocketchat
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'

volumes:
  mongo_data:
    driver: local
  rocketchat_uploads:
    driver: local
