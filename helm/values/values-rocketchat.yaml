rocketchat:
  enabled: true
  replicaCount: 1
  rootUrl: "http://rocketchat.local"
  image:
    repository: rocketchat.azurecr.io/rocketchat-v0.1
    tag: "latest"
    pullPolicy: Always
    imagePullSecrets:
      - name: acr-secret

  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: 34.131.148.151.nip.io   # change this
        paths:
          - path: /
            pathType: Prefix
  service:
    type: ClusterIP
    port: 3000
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  resources:
    limits:
      cpu: "2.0"
      memory: "2Gi"
    requests:
      cpu: "500m"
      memory: "1Gi"
  persistence:
    storageClassName: "longhorn"

mongodb:
  auth:
    rootUser: admin
    rootPassword: strongpassword123

nginx:
  replicaCount: 1
  image:
    repository: nginx
    tag: alpine
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    httpPort: 80
    httpsPort: 443
  resources:
    limits:
      cpu: "100m"
      memory: "128Mi"
    requests:
      cpu: "50m"
      memory: "64Mi"
