{{- if .Values.nginx.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-nginx
  labels:
    app: nginx
spec:
  replicas: {{ .Values.nginx.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.nginx.image.repository }}:{{ .Values.nginx.image.tag }}"
          imagePullPolicy: {{ .Values.nginx.image.pullPolicy }}
          ports:
            - containerPort: 80
            - containerPort: 443
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            {{- if .Values.nginx.tls.enabled }}
            - name: nginx-tls
              mountPath: /etc/nginx/tls
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.nginx.resources | nindent 12 }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ .Release.Name }}-nginx-config
            items:
              - key: {{ if .Values.nginx.tls.enabled }}nginx-ssl.conf{{ else }}nginx.conf{{ end }}
                path: nginx.conf
        {{- if .Values.nginx.tls.enabled }}
        - name: nginx-tls
          secret:
            secretName: nginx-tls
            optional: true
        {{- end }}
{{- end }}
