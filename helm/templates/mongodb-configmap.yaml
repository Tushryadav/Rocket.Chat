{{- if .Values.mongodb.enabled }}
{{- if .Values.mongodb.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-mongodb-init
  labels:
    app: mongodb
data:
  mongo-init.js: |
    try {
      var status = rs.status();
      print("Replica set already initialized, skipping.");
    } catch (e) {
      if (e.code === 94 || e.message.includes("no replset config")) {
        print("Initializing replica set...");
        rs.initiate({
          _id: "rs0",
          version: 1,
          members: [
            { _id: 0, host: "{{ .Release.Name }}-mongodb-0.{{ .Release.Name }}-mongodb.{{ .Release.Namespace }}.svc.cluster.local:27017" }
          ]
        });
        print("Replica set initialized successfully.");
      } else {
        print("Unexpected error: " + e.message);
        quit(1);
      }
    }
{{- end }}
{{- end }}
