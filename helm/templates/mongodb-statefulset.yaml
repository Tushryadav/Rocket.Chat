apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-mongodb
  labels:
    app: mongodb
spec:
  serviceName: "{{ .Release.Name }}-mongodb"
  replicas: {{ .Values.mongodb.replicaCount }}
  selector: 
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      initContainers:
      - name: mongo-init
        image: "{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"
        command:
          - bash
          - -c
          - |
            until mongosh {{ .Release.Name }}-mongodb-0.{{ .Release.Name }}-mongodb:27017 --eval "db.adminCommand('ping')" > /dev/null 2>&1; do
              echo "Waiting for Mongo..."
              sleep 2
            done

            mongosh {{ .Release.Name }}-mongodb-0.{{ .Release.Name }}-mongodb:27017 /scripts/mongo-init.js
        volumeMounts:
          - name: mongo-init-js
            mountPath: /scripts/mongo-init.js
            subPath: mongo-init.js

      volumes:
        - name: mongo-keyfile
          secret:
            secretName: {{ .Release.Name }}-mongodb-key
            defaultMode: 0400
        - name: mongo-init-js
          configMap:
            name: {{ .Release.Name }}-mongodb-init
        - name: mongopvc
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-mongo-pvc
      containers:
        - name: mongodb
          image: "{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"
          imagePullPolicy: {{ .Values.mongodb.image.pullPolicy }}
          command:
            - docker-entrypoint.sh
            - mongod
            - --replSet
            - rs0
            - --bind_ip_all
            - --keyFile
            - /etc/mongo-keyfile/mongo-keyfile
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-rocketchat-secret
                  key: mongo-root-user
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-rocketchat-secret
                  key: mongo-root-password
          ports:
            - containerPort: 27017
              name: mongodb
          volumeMounts:
            - name: mongopvc
              mountPath: /data/db
            - name: mongo-keyfile
              mountPath: /etc/mongo-keyfile
            - name: mongo-init-js
              mountPath: /scripts/mongo-init.js
              subPath: mongo-init.js
          resources:
            {{- toYaml .Values.mongodb.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - mongosh
                - -u
                - $(MONGO_INITDB_ROOT_USERNAME)
                - -p
                - $(MONGO_INITDB_ROOT_PASSWORD)
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 10
