{{- if .Values.mongodb.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-mongodb
  labels:
    app: mongodb
spec:
  serviceName: "{{ .Release.Name }}-mongodb"
  replicas: {{ .Values.mongodb.replicaCount }}
  selector: 
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      securityContext:
          runAsNonRoot: false          # initContainer needs root — set per-container instead
          fsGroup: 999 
      volumes:
        - name: mongo-keyfile          # secret source (must be here)
          secret:
            secretName: {{ .Release.Name }}-mongodb-key
            defaultMode: 0400
        - name: mongo-keyfile-dir
          emptyDir: {}
        - name: mongo-init-js
          configMap:
            name: {{ .Release.Name }}-mongodb-init
        - name: mongopvc
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-mongo-pvc
      initContainers:
        - name: keyfile-init
          image: busybox
          securityContext:                    # ← missing entirely
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE"]  # only what chown actually needs
          command:
            - sh
            - -c
            - |
              cp /secret/mongo-keyfile /keyfile/mongo-keyfile
              chmod 0400 /keyfile/mongo-keyfile
              chown 999:999 /keyfile/mongo-keyfile
          volumeMounts:
            - name: mongo-keyfile
              mountPath: /secret
            - name: mongo-keyfile-dir
              mountPath: /keyfile
      containers:
        - name: mongodb
          securityContext:
              runAsNonRoot: true
              runAsUser: 999           # mongodb user in the official mongo image
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
          image: "{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"
          imagePullPolicy: {{ .Values.mongodb.image.pullPolicy }}
          command:  
            - docker-entrypoint.sh
            - mongod
            - --replSet
            - rs0
            - --bind_ip_all
            - --keyFile
            - /etc/mongo-keyfile/mongo-keyfile
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-rocketchat-secret
                  key: mongo-root-user
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-rocketchat-secret
                  key: mongo-root-password
          ports:
            - containerPort: 27017
              name: mongodb
          volumeMounts:
            - name: mongopvc
              mountPath: /data/db
            - name: mongo-init-js
              mountPath: /scripts/mongo-init.js
              subPath: mongo-init.js
            - name: mongo-keyfile-dir
              mountPath: /etc/mongo-keyfile
          lifecycle:
            postStart:
              exec:
                command: ["/bash/bin", "-c", "echo pod started"]
          resources:
            {{- toYaml .Values.mongodb.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - mongosh
                - -u
                - $(MONGO_INITDB_ROOT_USERNAME)
                - -p
                - $(MONGO_INITDB_ROOT_PASSWORD)
                - --authenticationDatabase
                - admin
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - mongosh
                - -u
                - $(MONGO_INITDB_ROOT_USERNAME)
                - -p
                - $(MONGO_INITDB_ROOT_PASSWORD)
                - --authenticationDatabase
                - admin
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 5
            periodSeconds: 10
{{- end }}
