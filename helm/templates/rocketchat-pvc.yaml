{{- if .Values.rocketchat.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-rocketchat-uploads
  labels:
    app: rocketchat
spec:
  storageClassName: {{ .Values.rocketchat.persistence.storageClassName | quote }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
{{- end }}
