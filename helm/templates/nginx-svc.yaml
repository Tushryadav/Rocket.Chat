{{- if .Values.nginx.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-nginx
  labels:
    app: nginx
spec:
  type: {{ .Values.nginx.service.type }}
  ports:
    - name: http
      port: {{ .Values.nginx.service.httpPort }}
      targetPort: 80
    - name: https
      port: {{ .Values.nginx.service.httpsPort }}
      targetPort: 443
  selector:
    app: nginx
{{- end }}
